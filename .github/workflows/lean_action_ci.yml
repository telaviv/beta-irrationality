name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build takes over an hour (the kernel-checked I3 A-certificate dominates).
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1

      - name: Axiom audit (only propext, Classical.choice, Quot.sound allowed)
        run: |
          lake env lean Axioms.lean | tee axioms.txt
          # Join continuation lines, then reject any axiom outside the standard three.
          tr '\n' ' ' < axioms.txt | grep -o "depends on axioms: \[[^]]*\]" > lists.txt
          if grep -vE "^depends on axioms: \[(propext|Classical\.choice|Quot\.sound|,| )*\]$" lists.txt; then
            echo "Non-standard axiom found"; exit 1
          fi
          test -s lists.txt
